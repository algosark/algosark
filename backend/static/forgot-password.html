<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Algosark</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f3f5f9;color:#0d1b3e;display:grid;place-items:center;min-height:100vh;margin:0}
    main{background:white;padding:2rem;border-radius:16px;max-width:440px;width:calc(100% - 3rem);box-shadow:0 12px 40px #0d1b3e18}
    input,button{font:inherit;padding:.8rem;width:100%;box-sizing:border-box;margin-top:.8rem}
    button{background:#c9972a;color:#fff;border:0;border-radius:8px;cursor:pointer}
    #message{min-height:1.5rem}
  </style>
</head>
<body>
  <main>
    <h1>Forgot your password?</h1>
    <p>Enter your account email and we’ll send a password reset link if an account matches.</p>
    <form id="forgotForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>
      <button>Send reset link</button>
    </form>
    <p id="message" role="status"></p>
    <a href="/login.html">Back to sign in</a>
  </main>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button');
      button.disabled = true;
      const message = document.getElementById('message');
      try {
        const response = await fetch('/api/password/forgot', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email: document.getElementById('email').value.trim()}),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Unable to send reset email.');
        message.textContent = data.message;
      } catch (error) {
        message.textContent = error.message || 'Unable to send reset email.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
