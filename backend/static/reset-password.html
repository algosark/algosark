<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password — Algosark</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f3f5f9;color:#0d1b3e;display:grid;place-items:center;min-height:100vh;margin:0}
    main{background:white;padding:2rem;border-radius:16px;max-width:440px;width:calc(100% - 3rem);box-shadow:0 12px 40px #0d1b3e18}
    input,button{font:inherit;padding:.8rem;width:100%;box-sizing:border-box;margin-top:.8rem}
    button{background:#c9972a;color:#fff;border:0;border-radius:8px;cursor:pointer}
    #message{min-height:1.5rem}
  </style>
</head>
<body>
  <main>
    <h1>Choose a new password</h1>
    <form id="resetForm">
      <label for="password">New password (at least 8 characters)</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <button>Reset password</button>
    </form>
    <p id="message" role="status"></p>
    <a href="/login.html">Back to sign in</a>
  </main>
  <script>
    const token = new URLSearchParams(location.hash.slice(1)).get('token');
    history.replaceState(null, '', location.pathname + location.search);
    document.getElementById('resetForm').addEventListener('submit', async event => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button');
      button.disabled = true;
      const message = document.getElementById('message');
      try {
        const response = await fetch('/api/password/reset', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token, password: document.getElementById('password').value}),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Unable to reset password.');
        message.textContent = data.message;
        event.currentTarget.hidden = true;
      } catch (error) {
        message.textContent = error.message || 'Unable to reset password.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
