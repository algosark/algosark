<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate user strategy — Algosark</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f3f5f9;color:#0d1b3e;display:grid;place-items:center;min-height:100vh;margin:0}
    main{background:white;padding:2rem;border-radius:16px;max-width:560px;width:calc(100% - 3rem);box-shadow:0 12px 40px #0d1b3e18}
    button{font:inherit;padding:.8rem 1.2rem;background:#c9972a;color:white;border:0;border-radius:8px;cursor:pointer}
    #message{white-space:pre-wrap}
    #diagnostic{display:none;margin-top:1rem;padding:1rem;border:1px solid #ef9a9a;border-radius:8px;background:#fff4f4;color:#7f1d1d}
    #diagnostic h2{font-size:1rem;margin:0 0 .5rem}
    #diagnostic pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}
  </style>
</head>
<body>
  <main>
    <h1>Generate the requested strategy</h1>
    <p>Use this time-limited admin link to generate a strategy for the account in the notification email. The user must have submitted the risk survey first.</p>
    <button id="generateButton">Generate strategy</button>
    <p id="message" role="status"></p>
    <section id="diagnostic" role="alert" aria-live="assertive">
      <h2>Generation error details</h2>
      <pre id="diagnosticDetails"></pre>
    </section>
  </main>
  <script>
    const hashParams = new URLSearchParams(location.hash.slice(1));
    const queryParams = new URLSearchParams(location.search);
    const token = hashParams.get('token') || queryParams.get('token');
    history.replaceState(null, '', location.pathname + location.search);
    document.getElementById('generateButton').addEventListener('click', async event => {
      const button = event.currentTarget;
      const message = document.getElementById('message');
      const diagnostic = document.getElementById('diagnostic');
      const diagnosticDetails = document.getElementById('diagnosticDetails');
      diagnostic.style.display = 'none';
      diagnosticDetails.textContent = '';
      if (!token) {
        message.textContent = 'This admin link is missing its token. Open the latest strategy notification email and use its link.';
        return;
      }
      button.disabled = true;
      try {
        const response = await fetch('/strategy/admin-generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token}),
        });
        const responseText = await response.text();
        let data;
        try {
          data = responseText ? JSON.parse(responseText) : {};
        } catch {
          const statusMessage = `HTTP ${response.status || 'unknown'}\n${responseText || 'The server returned an empty response.'}`;
          throw new Error(statusMessage);
        }
        if (!response.ok) {
          const details = [
            `HTTP ${response.status}`,
            data.phase && `Phase: ${data.phase}`,
            data.exception && `Exception: ${data.exception}`,
            data.message || data.detail,
          ].filter(Boolean).join('\n');
          const error = new Error(data.detail || `Strategy generation failed (HTTP ${response.status}).`);
          error.details = details;
          throw error;
        }
        if (!data.strategy?.strategy_name) {
          throw new Error('The server response did not include a generated strategy name.');
        }
        message.textContent = `Strategy generated for user ${data.user_id}: ${data.strategy.strategy_name}`;
      } catch (error) {
        message.textContent = error.message || 'Strategy generation failed.' + error;
        if (error.details) {
          diagnosticDetails.textContent = error.details;
          diagnostic.style.display = 'block';
        }
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
