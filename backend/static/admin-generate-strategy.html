<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate user strategy — Algosark</title>
  <style>
    body{font:16px system-ui,sans-serif;background:#f3f5f9;color:#0d1b3e;display:grid;place-items:center;min-height:100vh;margin:0}
    main{background:white;padding:2rem;border-radius:16px;max-width:560px;width:calc(100% - 3rem);box-shadow:0 12px 40px #0d1b3e18}
    button{font:inherit;padding:.8rem 1.2rem;background:#c9972a;color:white;border:0;border-radius:8px;cursor:pointer}
    #message{white-space:pre-wrap}
  </style>
</head>
<body>
  <main>
    <h1>Generate the requested strategy</h1>
    <p>Use this time-limited admin link to generate a strategy for the account in the notification email. The user must have submitted the risk survey first.</p>
    <button id="generateButton">Generate strategy</button>
    <p id="message" role="status"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('token');
    history.replaceState(null, '', location.pathname + location.search);
    document.getElementById('generateButton').addEventListener('click', async event => {
      const button = event.currentTarget;
      const message = document.getElementById('message');
      button.disabled = true;
      try {
        const response = await fetch('/strategy/admin-generate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token}),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Strategy generation failed.');
        message.textContent = `Strategy generated for user ${data.user_id}: ${data.strategy.strategy_name}`;
      } catch (error) {
        message.textContent = error.message || 'Strategy generation failed.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
